name: upstream-sync

# The weekly upstream sync (issues #5 and #36). When upstream main has moved past UPSTREAM.lock, tools/sync regenerates
# the vendored files as one commit on a branch "sync/<old>-<new>"; the branch is pushed, ci is dispatched on it and an
# issue opens with the sync report (the tier 3 PRs to port). When nothing moved it writes nothing. A failing sync fails
# the run and writes nothing. The glue and its tests: tools/sync/ci/.
#
# The sync runs upstream's code (its Yoga tests, on the regenerated files), so no job that runs it holds a write token:
#   mode             works out from the event alone whether this is a real run.
#   prepare          (read-only) syncs and hands the commit on as an artifact: a git bundle and a metadata file.
#   publish          (real runs; the write token) runs no upstream code and no dotnet. It checks the bundle against its
#                    own checkout (one commit on this commit, by the bot, changing only src/Upstream/, UPSTREAM.lock and
#                    the range's report), then pushes that commit, dispatches ci on it and opens the issue. ci's
#                    "tools/sync --check" on the branch then checks the vendored bytes against upstream and main's rules.
#   publish-dry-run  (dry runs; read-only) the same check, then says what a real run would do.
#
# Runners: GitHub-hosted. prepare takes vars.SYNC_RUNNER (a repo variable) when it is set; it is unset.
on:
  schedule:
    # Mondays 05:17 UTC (off the hour, when scheduled runs bunch up).
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (sync and report, push no branch and open no issue). A real run only happens from the default branch.
        type: boolean
        default: true
  # A change to the workflow or to tools/sync gets a dry run on its branch, since workflow_dispatch needs the file on the
  # default branch first. A push never writes: it is always a dry run.
  push:
    paths:
      - .github/workflows/upstream-sync.yml
      - tools/sync/**

permissions: {}

concurrency:
  group: upstream-sync-${{ github.ref }}
  cancel-in-progress: false

env:
  # The sync commit's identity, GitHub's own Actions bot. publish refuses a commit made by any other.
  GIT_AUTHOR_NAME: github-actions[bot]
  GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
  GIT_COMMITTER_NAME: github-actions[bot]
  GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

jobs:
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {} # reads only the event
    outputs:
      real: ${{ steps.mode.outputs.real }}
    steps:
      - name: Mode
        id: mode
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          DRY_INPUT: ${{ inputs.dry_run }}
          REF: ${{ github.ref }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          real=false
          if [ "$EVENT" = schedule ]; then real=true
          elif [ "$EVENT" = workflow_dispatch ] && [ "$DRY_INPUT" = false ]; then
            if [ "$REF" = "$DEFAULT_REF" ]; then real=true
            else echo "::notice::A real sync runs only from the default branch; this run is a dry run."; fi
          fi
          echo "real=$real" >> "$GITHUB_OUTPUT"
          echo "event=$EVENT real=$real"

  prepare:
    runs-on: ${{ vars.SYNC_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read # check out this repo; this job runs upstream's code, so it gets nothing more
    outputs:
      status: ${{ steps.prepare.outputs.status }} # up-to-date or built
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # nothing here talks to this repo's remote

      - name: Check out upstream main with full history (tools/sync refuses a shallow cache)
        uses: actions/checkout@v7
        with:
          repository: microsoft/microsoft-ui-reactor
          ref: main
          path: upstream
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          # tools/sync runs upstream's Yoga tests on the regenerated files: the SDK from global.json and the .NET 10 runtime.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Glue tests
        shell: bash
        run: node --test tools/sync/ci/upstream-sync.test.mjs

      - name: Sync, and bundle the commit
        id: prepare # outputs: status (up-to-date, built), branch
        shell: bash
        run: node tools/sync/ci/upstream-sync.mjs prepare --no-fetch --out "$RUNNER_TEMP/sync"

      - name: Hand the bundle to the publish job
        if: steps.prepare.outputs.status == 'built'
        uses: actions/upload-artifact@v7
        with:
          name: sync
          path: ${{ runner.temp }}/sync/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [mode, prepare]
    if: needs.mode.outputs.real == 'true' && needs.prepare.outputs.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the sync branch
      issues: write # read the sync issues, and open the one with the report
      actions: write # dispatch ci on the sync branch: a push made with this job's token starts no workflow
    steps:
      - uses: actions/checkout@v7 # the same commit prepare checked out; its credentials push the branch

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Take the bundle (outside the checkout)
        uses: actions/download-artifact@v8
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      - name: Check the bundle, push it, dispatch ci and open the issue
        id: publish # outputs: status (exists, opened), branch, issue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sync/ci/upstream-sync.mjs publish --bundle "$RUNNER_TEMP/sync"

  publish-dry-run:
    needs: [mode, prepare]
    if: needs.mode.outputs.real != 'true' && needs.prepare.outputs.status == 'built'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # check out this repo, and see whether the sync branch is pushed
      issues: read # see whether the range has an issue, as a real run would
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Take the bundle (outside the checkout)
        uses: actions/download-artifact@v8
        with:
          name: sync
          path: ${{ runner.temp }}/sync

      - name: Check the bundle and say what a real run would do
        id: publish # outputs: status (dry-run), branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/sync/ci/upstream-sync.mjs publish --dry-run --bundle "$RUNNER_TEMP/sync"
