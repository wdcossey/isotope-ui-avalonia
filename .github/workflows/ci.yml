name: ci

# Builds and tests what exists today against upstream at the commit pinned in UPSTREAM.lock.
# The vendored-files drift check (tools/sync --check) joins once #3 lands.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spikes:
    name: spikes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the upstream baseline
        id: lock
        shell: bash
        run: echo "sha=$(sed -n 's/^baseline=\([0-9a-f]*\).*/\1/p' UPSTREAM.lock)" >> "$GITHUB_OUTPUT"

      - name: Check out upstream at the baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/microsoft-ui-reactor
          ref: ${{ steps.lock.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Spike D tests (upstream Yoga tests + FlexPanel)
        shell: bash
        run: |
          dotnet test spikes/D-flex/Reactor.Avalonia.Flex.Tests -nologo -v:q | tee test.log
          grep -E "Passed!.*Total: +[0-9]+" test.log

      - name: Spike A error count unchanged
        shell: bash
        run: |
          out="$(node spikes/A-engine/run-spike.mjs 3)"
          echo "$out" | head -20
          total="$(echo "$out" | sed -n 's/^total //p')"
          expected="$(cat spikes/A-engine/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"
