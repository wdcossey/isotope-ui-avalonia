name: ci

# Builds and tests what exists today against upstream at the commit pinned in UPSTREAM.lock.
on:
  # Every branch push, so agent branches get CI. A pull_request trigger joins with the PR flow (#7);
  # adding it now would run every PR commit twice.
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs are cancelled on branches, never on main, so every main commit gets a result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  spikes:
    name: spikes (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }} # GitHub-hosted only (public repo; CLAUDE.md)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the upstream baseline
        id: lock
        shell: bash
        run: |
          sha="$(sed -n 's/^baseline=\([0-9a-f]*\).*/\1/p' UPSTREAM.lock)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "UPSTREAM.lock has no valid 'baseline=<40 hex>' line"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out upstream at the baseline
        uses: actions/checkout@v7
        with:
          repository: microsoft/microsoft-ui-reactor
          ref: ${{ steps.lock.outputs.sha }}
          path: upstream
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          # The SDK from global.json (C# 15 compiler) and the .NET 10 runtime every project targets.
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Spike D tests (upstream Yoga tests + FlexPanel), count unchanged
        shell: bash
        run: |
          dotnet test spikes/D-flex/Reactor.Avalonia.Flex.Tests -nologo -v:q --logger "console;verbosity=minimal" | tee test.log
          total="$(sed -n 's/.*Total: *\([0-9]*\).*/\1/p' test.log | tail -1)"
          expected="$(cat spikes/D-flex/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

      - name: Rewrite tool tests
        shell: bash
        run: node --test tools/rewrite-upstream.test.mjs

      - name: Spike A error count unchanged
        shell: bash
        run: |
          out="$(node spikes/A-engine/run-spike.mjs 3 2>&1)"
          head -20 <<<"$out"
          if grep -q "not understood" <<<"$out"; then echo "build-errors could not parse some error lines"; exit 1; fi
          total="$(sed -n 's/^total //p' <<<"$out")"
          expected="$(cat spikes/A-engine/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

      - name: Spike A step 4 (Roslyn rules) error count unchanged
        shell: bash
        run: |
          out="$(node spikes/A-engine/run-spike.mjs 4 2>&1)"
          head -20 <<<"$out"
          total="$(sed -n 's/^total //p' <<<"$out")"
          expected="$(cat spikes/A-engine/expected-total-step4.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

  library:
    # The library compiles the vendored files in src/Upstream, so this job has no upstream/ checkout: it proves the
    # library builds without one.
    name: library (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }} # GitHub-hosted only (public repo; CLAUDE.md)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - name: No upstream/ checkout
        shell: bash
        run: test ! -e upstream

      - name: Sample app builds (running it opens a real window, so CI doesn't)
        shell: bash
        run: dotnet build samples/Isotope.UI.Samples -nologo -v:q

      - name: Library tests (seam, hooks, controls, upstream engine tests), count unchanged
        shell: bash
        run: |
          dotnet test tests/Isotope.UI.Avalonia.Tests -nologo -v:q --logger "console;verbosity=minimal" | tee lib.log
          total="$(sed -n 's/.*Total: *\([0-9]*\).*/\1/p' lib.log | tail -1)"
          expected="$(cat tests/Isotope.UI.Avalonia.Tests/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

      - name: Migration analyzer tests, count unchanged
        shell: bash
        run: |
          dotnet test tests/Isotope.UI.Migration.Tests -nologo -v:q --logger "console;verbosity=minimal" | tee mig.log
          total="$(sed -n 's/.*Total: *\([0-9]*\).*/\1/p' mig.log | tail -1)"
          expected="$(cat tests/Isotope.UI.Migration.Tests/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

      - name: MCP server tests (each tool in process, and the built tool over stdio), count unchanged
        shell: bash
        run: |
          dotnet test tests/Isotope.UI.Mcp.Tests -nologo -v:q --logger "console;verbosity=minimal" | tee mcp.log
          total="$(sed -n 's/.*Total: *\([0-9]*\).*/\1/p' mcp.log | tail -1)"
          expected="$(cat tests/Isotope.UI.Mcp.Tests/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

  sync:
    name: sync check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows matters most here: its checkouts use core.autocrlf=true, which the byte-exact check must survive.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }} # GitHub-hosted only (public repo; CLAUDE.md)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Read the upstream baseline
        id: lock
        shell: bash
        run: |
          sha="$(sed -n 's/^baseline=\([0-9a-f]*\).*/\1/p' UPSTREAM.lock)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "UPSTREAM.lock has no valid 'baseline=<40 hex>' line"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out upstream with full history (tools/sync refuses a shallow cache)
        uses: actions/checkout@v7
        with:
          repository: microsoft/microsoft-ui-reactor
          ref: ${{ steps.lock.outputs.sha }}
          path: upstream
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Vendored files match upstream + transforms
        shell: bash
        run: node tools/sync/sync.mjs --check --no-fetch

      - name: Harness tests
        shell: bash
        run: node tools/sync/test/all.mjs

      - name: Upstream Yoga tests on the vendored code, count unchanged
        shell: bash
        run: |
          dotnet test tools/sync/verify/Upstream.Yoga.Tests -nologo -v:q --logger "console;verbosity=minimal" | tee verify.log
          total="$(sed -n 's/.*Total: *\([0-9]*\).*/\1/p' verify.log | tail -1)"
          expected="$(cat tools/sync/verify/Upstream.Yoga.Tests/expected-total.txt)"
          echo "total=$total expected=$expected"
          test "$total" = "$expected"

  packages:
    # Packs the three packages, checks them, and builds and runs a tiny consumer app against the packed packages alone
    # (#52; tools/packaging/pack.mjs), so packaging can't silently break. Publishing is release.yml's, on a v* tag only.
    # Like the library job, it needs no upstream/ checkout. GitHub-hosted runners only.
    name: packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # MinVer reads the version from the v* tags, so it needs the history and the tags.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Package check tests
        shell: bash
        run: node --test tools/packaging/test/*.test.mjs

      - name: Pack, check the packages, and run the consumer smoke test against them
        shell: bash
        run: node tools/packaging/pack.mjs --out "$RUNNER_TEMP/packages"
